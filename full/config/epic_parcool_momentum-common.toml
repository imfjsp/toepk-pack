
[FastRun]
	#true: enables this mod's custom FastRun animation replacement and related step/jump visuals.
	#false: keeps EpicParCool's default FastRun animation behavior and disables the R-key FastRun step.
	customFastRunAnimations = true
	#Restores EpicParCool's default CatLeap preparation and airborne animations.
	#false: WOM Natural Sprinter replaces CatLeap with its sprint-jump animation when the compatibility conditions are met.
	#true: skips the Natural Sprinter CatLeap animation and motion overrides while preserving CatLeap gameplay and Phantom Ascent priming.
	useEpicParCoolDefaultCatLeapAnimation = false
	#true: pressing the configured FastRun Step key can trigger a step during EpicParCool FastRun.
	#When WOM Natural Sprinter is available, its step resource is consumed. Otherwise this mod uses a generic cooldown.
	#This only works when customFastRunAnimations is also true.
	naturalSprinterManualStep = false
	#true: when WOM is not installed and no datapack FastRun rule matches the current weapon, automatically generates FastRun from the weapon's Epic Fight RUN animation.
	#false: unmatched no-WOM weapons use EpicParCool's default FastRun animation.
	#If the weapon RUN animation cannot be resolved, this option falls back to EpicParCool's default FastRun animation.
	autoGenerateFastRunFromCurrentWeapon = true
	#Cooldown, in ticks, for FastRun step when WOM Natural Sprinter is unavailable.
	#Natural Sprinter's own step resource is still used when available. 10 ticks is 0.5 seconds at 20 TPS.
	#Range: 1 ~ 100
	genericFastRunStepCooldownTicks = 10
	#Controls how FastRun Step and ParCool Dodge share one key.
	#When ParCool Dodge is disabled in ParCool settings, this option is ignored and the shared key behaves as FastRun Step.
	#disabled: do not arbitrate. Step and Dodge keep their normal behavior.
	#short_dodge_long_step: short press triggers Dodge; holding then releasing triggers Step. This is the default.
	#short_step_hold_dodge: short press triggers Step; holding triggers Dodge. Releasing after Dodge has fully ended can trigger Step.
	#single_step_double_dodge: single tap triggers Step after the double-tap window; double tap triggers Dodge.
	#Allowed Values: DISABLED, SHORT_DODGE_LONG_STEP, SHORT_STEP_HOLD_DODGE, SINGLE_STEP_DOUBLE_DODGE
	naturalSprinterStepDodgeConflictMode = "SHORT_DODGE_LONG_STEP"
	#Ticks held before a shared Step/Dodge key counts as a long press. 6 ticks is about 300 ms at 20 TPS.
	#Range: 1 ~ 40
	naturalSprinterStepDodgeLongPressTicks = 6
	#Maximum ticks between first release and second press for single_step_double_dodge. Single-tap Step is delayed by this window. Default 2 matches ParCool's native movement-key double-tap window.
	#Range: 1 ~ 20
	naturalSprinterStepDodgeDoubleTapGapTicks = 2
	#Maximum held ticks for the first tap to be eligible for double-tap Dodge.
	#Range: 1 ~ 40
	naturalSprinterStepDodgeFirstTapMaxTicks = 5
	#true: allows one startup step when entering FastRun.
	#false: entering FastRun never plays a startup step.
	fastRunStartStepAnimation = false
	#true: when FastRun is entered by a non-manual path, it can still auto-trigger one startup step.
	#false: non-manual FastRun entry does not auto-trigger a startup step; only the manual FastRun key path can do it.
	autoFastRunDash = false
	#Enables the local FastRun camera speed effect.
	#The effect combines an additional camera FOV with one shared EPM post-processing pass.
	fastRunCameraEffectEnabled = true
	#Base additional camera FOV, in degrees, while FastRun is moving.
	#The effect reaches 140% at full speed, follows filtered sustained movement, and ignores startup impulse spikes.
	#It fades out when FastRun ends.
	#Range: 0.0 ~ 30.0
	fastRunCameraFovBoostDegrees = 10.0
	#Center-preserving radial FOV stretch that grows toward the screen border during FastRun.
	#Range: 0.0 ~ 0.25
	fastRunCameraRadialStretchStrength = 0.08
	#Enables sparse white procedural speed lines while FastRun is moving.
	fastRunSpeedLinesEnabled = true
	#Overall opacity of the procedural FastRun speed lines.
	#Range: 0.0 ~ 1.0
	fastRunSpeedLineIntensity = 0.8
	#Fraction of angular sectors that contain FastRun speed lines.
	#Range: 0.05 ~ 1.0
	fastRunSpeedLineDensity = 0.38
	#Outward travel speed of the procedural FastRun speed lines.
	#Range: 0.0 ~ 8.0
	fastRunSpeedLineSpeed = 5.0
	#Base radial length of each procedural FastRun speed-line segment.
	#Range: 0.05 ~ 0.8
	fastRunSpeedLineLength = 0.46
	#Aspect-corrected circular radius around the screen center kept clear of FastRun speed lines.
	#Range: 0.0 ~ 0.8
	fastRunSpeedLineCenterClearRadius = 0.68
	#Normalized screen radius where FastRun speed lines begin fading near the border.
	#Range: 0.5 ~ 1.0
	fastRunSpeedLineOuterFadeStart = 0.98
	#Effective movement-speed multiplier relative to normal FastRun where dynamic blur and speed-line acceleration reach their configured maximum.
	#Range: 1.1 ~ 4.0
	fastRunDynamicEffectFullSpeedMultiplier = 2.0
	#Maximum multiplier applied to FastRun radial blur strength at the configured full dynamic speed.
	#Range: 1.0 ~ 5.0
	fastRunDynamicBlurStrengthMultiplier = 2.0
	#Maximum amount that the FastRun blur region expands inward toward the screen center at high speed.
	#Range: 0.0 ~ 0.4
	fastRunDynamicBlurInwardShift = 0.16
	#Maximum multiplier applied to the FastRun procedural speed-line travel speed at the configured full dynamic speed.
	#Range: 1.0 ~ 4.0
	fastRunDynamicSpeedLineSpeedMultiplier = 1.25
	#Radial blur sampling distance at the screen edge during FastRun.
	#Range: 0.0 ~ 0.15
	fastRunCameraBlurStrength = 0.03
	#Number of radial blur samples used by the shared screen pass while FastRun is visible.
	#Range: 1 ~ 8
	fastRunCameraBlurSamples = 6
	#Normalized rectangular screen radius where the FastRun effect begins. Lower values affect more of the screen.
	#Range: 0.0 ~ 0.99
	fastRunCameraEdgeStart = 0.42
	#Normalized rectangular screen radius where the FastRun effect reaches full strength.
	#Range: 0.01 ~ 1.0
	fastRunCameraEdgeFull = 0.9
	#Sustained screen-edge radial stretch while FastRun is moving at speed.
	#Range: 0.0 ~ 0.2
	fastRunCameraWarpStrength = 0.075
	#Ticks used to smoothly reach the FastRun screen-effect strength.
	#Range: 1 ~ 40
	fastRunCameraFadeInTicks = 2
	#Ticks used to smoothly remove the FastRun screen effect after slowing down or leaving FastRun.
	#Range: 1 ~ 40
	fastRunCameraFadeOutTicks = 6
	#Player speed, relative to vanilla sprint, required for Epic Fight MovementAnimation to reach the extended maximum playback speed.
	#1.6 means the animation reaches its maximum at 160% of vanilla sprint speed.
	#Range: 1.0 ~ 3.0
	movementAnimationSpeedCapMultiplier = 1.6
	#Maximum playback multiplier for player Epic Fight MovementAnimation above vanilla sprint speed.
	#The default 1.856 is 1.16 multiplied by 1.6.
	#Range: 1.16 ~ 4.0
	movementAnimationMaxPlaySpeed = 1.856
	#TaCZ gun index types that use WOM barehand sprint.
	#Common types include: pistol, smg, rifle, shotgun, sniper, mg.
	#Types not listed here use WOM weapon sprint. Set to [] to make all TaCZ gun types use WOM weapon sprint.
	taczBarehandSprintTypes = ["pistol"]

["Phantom Ascent"]
	#true: pressing jump after CatLeap can trigger Epic Fight Phantom Ascent.
	catLeapPrimesPhantomAscent = true
	#true: pressing jump after ParCool WallJump can trigger Epic Fight Phantom Ascent.
	wallJumpPrimesPhantomAscent = true
	#true: pressing jump after ParCool ClimbUp can trigger Epic Fight Phantom Ascent before glider deployment.
	climbUpPrimesPhantomAscent = true
	#true: pressing jump after Spider Techniques wall jump can trigger Epic Fight Phantom Ascent.
	spiderWallJumpPrimesPhantomAscent = true
	#true: replaces Epic Fight Phantom Ascent jump, fall, and landing animations with this mod's double-jump animation set.
	#false: keeps Epic Fight's original Phantom Ascent jump, fall, and landing animation behavior.
	replacePhantomAscentDoubleJumpAnimations = false
	#Maximum fall damage canceled by Phantom Ascent's next-fall protection. Epic Fight original default is 2.5.
	#Range: 0.0 ~ 100.0
	phantomAscentFallProtectionDamageThreshold = 2.5
	#true: blocks Epic Fight Phantom Ascent while the player is swimming underwater.
	#false: keeps Epic Fight's original Phantom Ascent behavior underwater.
	disablePhantomAscentUnderwaterSwimming = true

["Demolition Leap"]
	#true: after learning Epic Fight Demolition Leap, Shift+Jump starts Demolition Leap through Epic Fight's original hold/release chain and suppresses ParCool Cat Leap/Charge Jump on that input.
	#false: keeps Epic Fight Demolition Leap and ParCool Cat Leap/Charge Jump trigger paths separate.
	demolitionLeapShiftSpaceReplacement = true
	#true: after Demolition Leap launches the player, the next new airborne jump press triggers Epic Fight Phantom Ascent through its native chain.
	demolitionLeapAirDoubleJump = true
	#true: before learning Demolition Leap, ParCool Charge Jump charging uses Demolition Leap's charging animation in Epic Fight mode. After learning Demolition Leap, Shift alone shows no charging animation - only Shift+Space triggers the skill.
	demolitionLeapChargeJumpAnimation = true

[WallJump]
	#true: automatically restores sprint shortly after ParCool WallJump.
	autoSprintAfterWallJump = true
	#true: ParCool WallJump opens a short window for Epic Fight air attacks.
	wallJumpPrimesAirAttack = true
	#true: TaCZ guns can cancel ParCool WallJump and fire immediately.
	taczShootDuringWallJump = true
	#Maximum fall damage canceled after a ParCool WallJump air-attack window. Matches Phantom Ascent's default value.
	#Range: 0.0 ~ 100.0
	wallJumpAirAttackFallProtectionDamageThreshold = 2.5

["Spider Techniques"]
	#Wall-run mode used after learning WOM Spider Techniques.
	#default: Default wall-run mode. This mod does not replace ParCool/WOM wall-run triggers, but keeps original WOM side wall-run direction and corner-transfer fixes.
	#parcool: ParCool wall-run mode. ParCool's HorizontalWallRun key triggers this mod's WOM-style wall run replacement.
	#wom: WOM wall-run mode. WOM's original sprint input owns Spider Techniques wall run, while ParCool HorizontalWallRun and its key input are disabled.
	#Modes that need WOM do nothing when WOM is not installed or Spider Techniques is not learned.
	#Allowed Values: DEFAULT, PARCOOL, WOM
	spiderTechniquesWallRunMode = "PARCOOL"
	#Animation transition time used when ParCool wall-run mode switches WOM Spider Techniques wall-run animations.
	#Higher values feel heavier but make direction changes slower.
	#Range: 0.0 ~ 0.5
	parCoolWallRunAnimationTransition = 0.12
	#Maximum horizontal look angle, in degrees, for WOM Spider Techniques wall jump to keep priority over ParCool WallJump.
	#0 means the player must look straight into the wall. 90 means WOM keeps priority from any side-facing angle.
	#Default 50 lets direct wall-facing input use WOM, while side-facing wall-run input prefers ParCool WallJump.
	#Range: 0.0 ~ 90.0
	spiderWallJumpWomFrontAngle = 50.0
	#true: disables ParCool VerticalWallRun after learning WOM Spider Techniques.
	disableVerticalWallRunWithSpiderTechniques = true

["Aqua Maneuvre"]
	#true: without Aqua Maneuvre, maps ParCool FastSwimAnimator to WOM's Mermaid animation in Epic Fight mode.
	#After learning Aqua Maneuvre, ParCool's FastRun control mode only drives WOM's original Mermaid fast-swim input; WOM owns movement, speed, animation start, and animation exit.
	aquaManeuvreFastSwimAnimation = true

[EpicFightX]
	#true: after learning EpicFightX Combat Mastery II, post-dodge sprint follows this mod's Combat Mastery sprint trigger mode.
	#false: keeps EpicFightX's original Combat Mastery II sprint trigger behavior.
	epicFightXCombatMasteryFastRunControlCompatibility = true
	#Controls how this mod enters vanilla sprint after an EpicFightX Combat Mastery II dodge window.
	#Toggle: press the FastRun key again after the dodge, then hold forward to enter vanilla sprint.
	#Auto: automatically enters vanilla sprint after the dodge when forward input is held.
	#PressKey: hold the FastRun key and forward input to enter and keep vanilla sprint.
	#Allowed Values: Toggle, Auto, PressKey
	epicFightXCombatMasterySprintTriggerMode = "Toggle"

[Vault]
	#true: when Vault starts from FastRun, releases ParCool's Vault action at 6 ticks and keeps a short FastRun grace window so close obstacles can chain through ParCool's original Vault detection.
	#false: keeps ParCool's original Vault action timing and disables this mod's FastRun Vault chaining assist.
	fastRunVaultChainFix = true
	#true: lets Vault accept a short recent-FastRun window when FastRun drops immediately before ParCool Vault can start.
	#false: Vault start requires ParCool FastRun to still be actively doing, except for the existing post-Vault chain grace.
	vaultStartFastRunGrace = true
	#Changes ParCool Vault's maximum detected obstacle height.
	#ParCool original default is 0.86. This compatibility mod defaults to 1.5 for stable three-block air vaults.
	#Lower values require more precise jump timing.
	#Range: 0.86 ~ 2.0
	vaultHeightScale = 1.5

[Climb]
	#Vertical velocity applied when EpicFight mode starts ParCool ClimbUp.
	#ParCool original value is 0.6. This defaults to 0.65 to better match EpicFightParCool's climb-up animation with re-grabbing full blocks.
	#Range: 0.6 ~ 0.8
	epicParCoolClimbUpVerticalVelocity = 0.65
	#Per-tick left/right air-control velocity applied during EpicParCool ClimbUp.
	#Set to 0.0 to disable. This only affects left/right input and is intended to mimic ParCool's vanilla air movement.
	#Range: 0.0 ~ 0.05
	epicParCoolClimbUpLateralAirControlVelocity = 0.02
	#How many ticks after EpicParCool ClimbUp starts left/right air-control compensation can be applied.
	#Set to 0 to disable.
	#Range: 0 ~ 20
	epicParCoolClimbUpLateralAirControlTicks = 6

[Sandevistan]
	#Enables the Sandevistan time-dilation skill.
	sandevistanEnabled = true
	#Independent Sandevistan HUD horizontal coordinate used by Epic Fight's HUD setup screen.
	#Range: -10000 ~ 10000
	sandevistanHudX = 0
	#Independent Sandevistan HUD vertical coordinate used by Epic Fight's HUD setup screen.
	#Range: -10000 ~ 10000
	sandevistanHudY = 70
	#Horizontal screen basis of the independent Sandevistan HUD: LEFT, RIGHT, or CENTER.
	sandevistanHudHorizontalBasis = "CENTER"
	#Vertical screen basis of the independent Sandevistan HUD: TOP, BOTTOM, or CENTER.
	sandevistanHudVerticalBasis = "BOTTOM"
	#Maximum number of Sandevistan afterimages retained for the local player.
	#Range: 1 ~ 64
	sandevistanAfterimageMaxCount = 24
	#Maximum number of Sandevistan afterimages retained for each remote player.
	#Range: 1 ~ 64
	sandevistanRemoteAfterimageMaxCount = 16
	#Lifetime in ticks of each Sandevistan afterimage.
	#Range: 1 ~ 100
	sandevistanAfterimageLifetimeTicks = 24
	#Minimum movement distance in blocks before another afterimage can be captured.
	#Range: 0.0 ~ 2.0
	sandevistanAfterimageMinDistance = 0.2
	#Ticks between afterimage captures while performing an Epic Fight action without moving.
	#Range: 1 ~ 40
	sandevistanStationaryActionAfterimageIntervalTicks = 2
	#Client ticks between capturing a stationary action pose and displaying its afterimage.
	#Range: 0 ~ 40
	sandevistanStationaryActionAfterimageDisplayDelayTicks = 2
	#Lifetime in ticks of afterimages captured from stationary Epic Fight actions.
	#Range: 1 ~ 100
	sandevistanStationaryActionAfterimageLifetimeTicks = 15
	#Starting opacity of stationary Epic Fight action afterimages.
	#Range: 0.05 ~ 1.0
	sandevistanStationaryActionAfterimageAlpha = 0.85
	#Opacity reached by stationary Epic Fight action afterimages at the end of their lifetime.
	#Range: 0.0 ~ 1.0
	sandevistanStationaryActionAfterimageEndAlpha = 0.45
	#Constant hex RGB tint of stationary Epic Fight action afterimages.
	sandevistanStationaryActionAfterimageColor = "#33E6FF"
	#Initial opacity of textured Sandevistan afterimages.
	#Range: 0.05 ~ 1.0
	sandevistanAfterimageAlpha = 0.86
	#Hex RGB tint used by newly captured afterimages.
	sandevistanAfterimageStartColor = "#33E6FF"
	#Hex RGB tint used midway through an afterimage's lifetime.
	sandevistanAfterimageMiddleColor = "#AD4DFF"
	#Hex RGB tint used by fading afterimages.
	sandevistanAfterimageEndColor = "#FF941F"
	#Enables the low-cost green Sandevistan screen filter.
	sandevistanFilterEnabled = true
	#Strength of the green Sandevistan screen filter.
	#Range: 0.0 ~ 1.0
	sandevistanFilterIntensity = 1.0
	#Ticks used to fade in the Sandevistan screen filter.
	#Range: 1 ~ 40
	sandevistanFilterFadeInTicks = 6
	#Ticks used to fade out the Sandevistan screen filter.
	#Range: 1 ~ 40
	sandevistanFilterFadeOutTicks = 8
	#Hex RGB channel multiplier used by the low-cost Sandevistan color grade.
	sandevistanFilterColor = "#3CFF48"
	#Debug only. Replaces the world with the solid filter color to inspect stencil exclusions.
	sandevistanFilterDebugGreenScreen = false
	#Enables the low-cost radial blur around the screen edges while Sandevistan is active.
	sandevistanEdgeBlurEnabled = true
	#Overall opacity of the Sandevistan edge blur.
	#Range: 0.0 ~ 1.0
	sandevistanEdgeBlurIntensity = 1.0
	#Distance sampled toward the screen center. Higher values create longer blur trails.
	#Range: 0.0 ~ 0.6
	sandevistanEdgeBlurStrength = 0.3
	#Texture samples used by the edge blur. Higher values look smoother but cost more GPU time.
	#Range: 1 ~ 12
	sandevistanEdgeBlurSamples = 10
	#Position where edge blur begins. 0 is the screen center and 1 is the screen border.
	#Increase this value to restrict blur to a thinner outer edge.
	#Range: 0.0 ~ 0.99
	sandevistanEdgeBlurStart = 0.6
	#Position where edge blur reaches full strength. 0 is the screen center and 1 is the screen border.
	#This should normally be greater than sandevistanEdgeBlurStart.
	#Range: 0.01 ~ 1.0
	sandevistanEdgeBlurFull = 0.8
	#Enables the radial screen-edge distortion pulse when Sandevistan activates.
	sandevistanEdgeWarpEnabled = true
	#Maximum UV displacement used by the Sandevistan activation distortion pulse.
	#Range: 0.0 ~ 0.35
	sandevistanEdgeWarpStrength = 0.2
	#Total duration in ticks of the Sandevistan activation distortion pulse.
	#Range: 1 ~ 40
	sandevistanEdgeWarpDurationTicks = 12
	#Ticks used for the activation distortion pulse to reach full strength before fading out.
	#Range: 0 ~ 10
	sandevistanEdgeWarpRiseTicks = 5
	#Position where activation distortion begins. 0 is the screen center and 1 is the screen border.
	#Increase this value to preserve a larger undistorted center area.
	#Range: 0.0 ~ 0.99
	sandevistanEdgeWarpStart = 0.45
	#Position where activation distortion reaches full strength. 0 is the screen center and 1 is the screen border.
	#This should normally be greater than sandevistanEdgeWarpStart.
	#Range: 0.01 ~ 1.0
	sandevistanEdgeWarpFull = 0.6
	#Enables radial RGB channel separation during the Sandevistan activation pulse.
	sandevistanChromaticAberrationEnabled = true
	#Maximum UV offset between red and blue channels during the activation pulse.
	#Range: 0.0 ~ 0.04
	sandevistanChromaticAberrationStrength = 0.012
	#Enables the short white exposure flash at the peak of Sandevistan activation.
	sandevistanActivationFlashEnabled = true
	#Maximum white exposure mixed into the screen at the activation peak.
	#Range: 0.0 ~ 1.0
	sandevistanActivationFlashStrength = 0.72

[Debug]
	#Temporary debug option. true: logs Spider Techniques state when attack executability is checked.
	debugSpiderTechniquesAttackState = false
	#Temporary debug option. true: logs detailed Spider Techniques wall-run state.
	debugSpiderWallRunState = false
	#Temporary debug option. true: logs detailed Demolition Leap compatibility state.
	debugDemolitionLeapState = false
	#Temporary debug option. true: logs jump/action arbitration and handoff state.
	debugActionArbitrationState = false
	#Temporary debug option. true: logs detailed ClingToCliff and ClimbUp diagnostics.
	debugClingToCliffState = false
	#Temporary debug option. true: logs detailed Aqua Maneuvre fast-swim state.
	debugAquaManeuvreFastSwimState = false
	#Temporary debug option. true: logs detailed EpicFightX Combat Mastery II sprint trigger state.
	debugEpicFightXCombatMasterySprintState = false
	#Temporary debug option. true: logs detailed ParCool Vault canStart, movement, and post-vault state.
	debugVaultState = false
	#Temporary debug option. true: logs detailed Glider/FastRun diagnostic state.
	debugGliderState = false
	#Temporary debug option. true: logs FastRun startup step and procedural pulse state.
	debugNaturalSprinterFastRunStepState = false
	#Temporary debug option. true: logs low-stamina exhaustion pose diagnostics.
	debugExhaustionPoseState = false
	#Temporary debug option. true: renders the current Epic Fight base animation above the hotbar.
	debugEpicFightAnimationHud = false
	#Temporary debug option. true: logs camera angle event diagnostics for intermittent camera shake investigation.
	debugCameraEventState = false
	#Logs Sandevistan rendering costs when a client frame exceeds the configured hitch threshold.
	debugSandevistanPerformance = false
	#Client frame time in milliseconds that triggers a Sandevistan performance diagnostic log.
	#Range: 16 ~ 250
	debugSandevistanPerformanceThresholdMs = 33

[Internal]
	#Internal marker. Prevents Epic ParCool: Momentum from overriding a player-enabled ParCool Dodge setting after the default-off migration has run once.
	parCoolDodgeDefaultMigrationApplied = true

