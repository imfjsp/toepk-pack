# T'O EPK settings

# Replace the Minecraft logo on the title screen with the T'O EPK logo
title.customLogo=true

# Animate the dragon head (slow, subtle movement)
title.animateHead=true

# Pulsing glow on the dragon eye
title.eyeGlow=true

# Twinkling sparkles on the logo
title.sparkles=true

# Hide the yellow splash text
title.hideSplash=true

# Logo rises and fades in each time you return to the main menu
title.introAnimation=true

# Use the T'O EPK animated background instead of the vanilla panorama
title.customBackground=true

# Background layers move slightly with the mouse
title.parallax=true

# Floating light particles on the background
title.particles=true

# Hide the version/branding lines, update notice and copyright text
title.removeExtraTexts=true

# Left-side menu with only Singleplayer, Multiplayer, Mods and Quit
title.customMenu=true

# Animated lights (glow, flicker, fog) on the menu background
title.lightEffects=true

# Built-in resource pack that recolours other mods' screens (Epic Fight's skill editor) in T'O EPK purple
ui.themeOtherScreens=true

# Xaero's World Map without its side buttons (right click on the map creates and shares waypoints)
ui.cleanWorldMap=true

# Epic Fight's skill key opens the T'O EPK skill screen on the combat techniques tab
ui.efSkillsTab=true

# T'O EPK item tooltips: sections, icons, Shift for descriptions, tier-coloured border
ui.customTooltips=true

# Animated tier frames on item tooltips (style of Ultimate Tooltips, recoloured to the pack)
ui.tooltipFrames=true

# Minimal T'O EPK style for buttons and sliders in every screen
ui.minimalWidgets=true

# Show the T'O EPK background behind menus outside a world (options, create world, mods...)
ui.backgroundInMenus=true

# How dark the background is behind other menus (0-100)
ui.menuDimPercent=62

# T'O EPK loading screen instead of the Mojang logo and white bar
ui.loadingScreen=true

# Smooth transitions when creating/entering a world and returning to the main menu
ui.transitions=true

# Remove the small icon buttons other mods add to the pause menu
ui.cleanPauseMenu=true

# Give the class starter kit the first time a player chooses a class
classes.starterKit=true

# The armour of the class starter kit is put on automatically
classes.wearKitArmor=true

# Let players change their class freely (admins can always use /toepk clase asignar)
classes.allowChange=false

# Experience multiplier in percent (100 = normal)
levels.xpPercent=100

# Weapons above your tier deal less damage and armour above your tier cannot be equipped
tiers.enforce=true

# Show the level panel (top right). Toggle in game with the HUD key
hud.panel=true

# Show the compass bar at the top of the screen
hud.compass=true

# Show coordinates under the compass
hud.coords=true

# Show info about the block or creature you are looking at
hud.lookInfo=false

# Minimum GUI scale used by the T'O EPK menus (bigger text); 0 = use the game GUI scale
ui.menuScale=3

# Hostile mobs spawn with a level based on nearby players
mobs.scaling=true

# Radius to look for players when a mob spawns
mobs.radius=96

# Random variation of the mob level (+/-)
mobs.spread=2

# Extra health per mob level (0.04 = +4% per level)
mobs.healthPerLevel=0.04

# Extra damage per mob level
mobs.damagePerLevel=0.025

# Extra armor per mob level
mobs.armorPerLevel=0.08

# Scaling multiplier for bosses
mobs.bossFactor=0.5

# Entities that never scale (comma separated)
mobs.exclude=minecraft:ender_dragon

# Show the level plate over mobs
mobs.tags=true

# Max distance to show mob levels (double when you aim at them)
mobs.tagDistance=20

# Level needed to use the rebirth orb (you get one when you reach it)
rebirth.level=50

# Experience multiplier gained per rebirth (stacks: 2 rebirths = x4, 3 = x8...)
rebirth.xpMultiplier=2.0

# Creatures that are never treated as bosses (comma separated ids)
mobs.notBosses=

# Extra creatures always treated as bosses (comma separated ids)
mobs.bosses=

# World events: blood moon, raider siege, meteor shower, merchant caravan and wandering boss
events.enabled=true

# A little market (Medieval Market v2 / Merchant Pack furniture) grows around the bell of each village the first time a player comes near
world.villageMarkets=true

# Caravan camps set up booths, stalls and goods around their wagons (packed away when they leave)
world.caravanMarkets=true

# The raider siege's last wave brings the Redstone Engineer (a boss that builds an automaton, a tesla tower and drones)
events.siegeBoss=true

# First in-game day an event can happen
events.firstDay=20

# Minimum in-game days between two events
events.minDays=6

# Maximum in-game days between two events
events.maxDays=14

# Monster level multiplier during the blood moon
events.bloodMoonLevelMultiplier=2.0

# Minimum distance (blocks) from a player where the big meteor falls
events.meteorMinDistance=200

# Maximum distance (blocks) from a player where the big meteor falls
events.meteorMaxDistance=300

# Translate automatically every mod text that has no translation in the game's language (cached in config/toepk/traducciones; edit those files to fix a translation)
translate.enabled=true

# Optional free key from Google AI Studio (aistudio.google.com/apikey): translates with Gemini, much faster and better than the free Google Translate
translate.geminiKey=

# Gemini model used for translating
translate.geminiModel=gemini-2.5-flash-lite

# Highest level a monster or boss can have
mobs.maxLevel=100

# Old routing: the crypts end in the Epic Fight boss arenas (Arachne, Leonidas, Mimic, Wraithon). Off: the crypts have their own bosses (Pluto, Frost Lord, Void Hydra, Shadow Sorcerer) and the Epic Fight bosses work as their mods intended
crypt.efBosses=false

# Crypt bosses: multiplier of each boss's health (also boss.pluto, boss.cerberus, boss.void_hydra, boss.shadow_sorcerer)
boss.frost_lord.health=1.0

# The Epic Fight bosses that end each crypt (Arachne, Leonidas, Mimic, Wraithon) can only be fought through a crypt: their items, arenas and spawns are locked
crypt.lockBosses=true

# Final boss of the copper crypt (entity id, or a bare name searched among all mods). Also: .dimension, .x, .y, .z (arrival), .bossDx, .bossDz, .radius, .lockedItems
crypt.boss.copper.entity=arachne

# Final boss of the jade crypt
crypt.boss.jade.entity=leonidas

# Final boss of the abyssal crypt
crypt.boss.abyss.entity=mimic

# Final boss of the obsidian crypt
crypt.boss.obsidian.entity=wraithon

# Meteor guardians per kind (the first that exists is used): kind:entity=health multiplier
events.meteorGuardians=fire:cataclysm:ignited_revenant=3,fire:cataclysm:ignited_berserker=5,radioactive:alexscaves:brainiac=4,crystal:cataclysm:amethyst_crab=2,void:cataclysm:ender_golem=2,void:minecraft:enderman=8

# A surface structure is not generated where it would overlap or touch another one (villages and strongholds always keep their place)
worldgen.noStructureOverlap=true

# Chat messages hidden on the client when they contain any of these texts (separated by |)
chat.hiddenMessages=Thanks for Downloading! We have found Epic Fight|dragones de Saint|Saint's Dragons wiki|raevyx.miraheze.org

# Server ranks: Admin (operator) and Jugador, with their badge in the chat and the tab list (/rango)
ranks.enabled=true

# Admin is made operator; on a dedicated server Jugador loses the operator status
ranks.syncOp=true

# /pagar <jugador> <cantidad> [oro|plata|cobre]: send coins from your vault to another player's vault
pay.enabled=true

# /back (/volver): return to where you died or to where you were before your last teleport
back.enabled=true

# Price of /back in silver, from the vault
back.costSilver=10

# Price of /back to the place where you died, in silver
back.deathSilver=15

# Seconds between two uses of /back
back.cooldownSeconds=30

# Minutes without moving before a player is marked away by himself (0 = only with /afk)
afk.minutes=5

# Teleport requests between players: /tpa, /tpahere, /tpaccept, /tpadeny, /tpacancel, /tpatoggle
tpa.enabled=true

# Base price of a teleport in silver coins, paid from the requester's vault when it happens
tpa.costSilver=8

# Extra silver for every 1000 blocks between the two players
tpa.silverPer1000=1

# Extra silver when the players are in different dimensions
tpa.dimensionSilver=10

# Highest price of a teleport in silver
tpa.maxSilver=30

# Allow teleporting between dimensions (crypts are always closed)
tpa.crossDimension=true

# Seconds a request waits for an answer
tpa.expireSeconds=60

# Seconds the traveller must stand still before leaving (moving or getting hurt cancels it)
tpa.warmupSeconds=3

# Seconds before a player can travel again after a teleport
tpa.cooldownSeconds=20

# Commands a Jugador may use, separated by commas (* = all the ones a normal player has)
ranks.playerCommands=*

# T'O EPK player list on the Tab key (ranks, class, level, lives, time played)
ui.customTab=true

# Lives: every player has a few; each death costs one and with none left the player becomes a soul (spectator) until revived
lives.enabled=true

# Lives of each player (1-20)
lives.max=5

# Lives a player comes back with from a Resurrection Altar
lives.reviveLives=2

# Lives a soul comes back with from a Soul Shrine
lives.shrineLives=1

# Echoes a soul must bring back to its Soul Shrine, one by one, before its ritual (1-7)
lives.shrineEchoes=3

# Nearest distance (blocks) of a soul's echoes from its shrine
lives.echoMin=1500

# Farthest distance (blocks) of a soul's echoes from its shrine
lives.echoMax=2000

# Soul Shrines answer even when other players are alive (by default only when nobody is left to revive the soul, as in singleplayer)
lives.shrineAlways=false

# Soul Shrines (the soul tree) cannot be broken by digging, explosions or pistons
lives.shrineUnbreakable=true

# Creative players cannot break Soul Shrines either
lives.shrineProtectCreative=false

# If no Soul Shrine is found near a soul with nobody to help it, one is raised close by
lives.shrineFallback=true

# How far (chunks) the nearest Soul Shrine is searched for
lives.shrineSearchChunks=120

# Lives as hearts in the tab list
lives.tabList=true

# Death messages in the chat show the hearts left
lives.chat=true

# A banner for everyone when a player dies or is revived
lives.banner=true

# Multiplier for hearts, essences and totems found in loot and dropped by bosses
lives.lootRate=1.0

# A big surface structure is not generated where part of its ground is a river or the sea (castles standing in rivers)
worldgen.noStructuresOnWater=true

# Share of a structure's ground (percent) that may be river or sea before it is not generated there
worldgen.waterRejectPercent=15

# Only structures at least this wide (blocks) are checked for water
worldgen.waterMinSize=24

# Structures (name parts or mod ids) made for the water, never checked
worldgen.waterStructures=ocean,shipwreck,sunken,river,swamp,bridge,boat,ship,pier,dock,harbor,harbour,port,lighthouse,fishing,beach,island,coral,reef,atlantis,lake,mangrove,water

# Log the structures skipped for being on water
worldgen.debugStructures=false

# Minimum gap in blocks between two surface structures
worldgen.structureMargin=6

# Smooth the terrain around surface jigsaw structures (villages, towns, ruins) so none leaves straight walls or floating floors; only new chunks
worldgen.smoothStructures=true

# Most blocks the smoothing digs below the natural ground, even under a piece (deep foundations made square pits)
worldgen.smoothMaxCut=6

# Most blocks the smoothing raises the ground above its natural height
worldgen.smoothMaxFill=10

# Natural spawn cap of monsters, times the vanilla one (70); 1 = vanilla
mobs.cap.monster=1.0

# Natural spawn cap of bats and other ambient mobs, times the vanilla one (15); 1 = vanilla
mobs.cap.ambient=1.0

# Natural spawn cap of fish, glow squids and axolotls, times the vanilla ones; 1 = vanilla
mobs.cap.water=1.0

# Blocks around each structure piece over which the terrain slopes back to its natural height (8-48)
worldgen.smoothRadius=28

# Structures (id contains any of these words) left as their mod made them
worldgen.smoothExclude=airship,sunken,shipwreck,ocean,ruined_portal,buried,fossil,sky,floating,underwater,cave,mineshaft,dungeon,crypt,catacomb,tomb,stronghold,ancient_city,trail_ruins,igloo,underground,labyrinth,meteor,castle,temple,fortress,citadel,keep,mowziesmobs

# Every Iron's Spellbooks spell is already learned (eldritch spells too) and spell scrolls are never locked by level
compat.ironsLearnAll=true

# Extra damage (%) when a class fights with the weapons of its speciality (swords for the warrior, katanas for the ronin, bows for the archer...)
classes.specialtyPercent=12

# Red reticle on mobs: a hit aimed inside it is a critical (it moves every few seconds)
combat.weakPoints=true

# Damage multiplier of a critical hit (inside the red reticle)
combat.critMultiplier=1.6

# Ticks allowed between two hits to keep the combo going (20 = 1 second)
combat.comboWindowTicks=50

# Combo counter next to the mob, with sounds and effects
ui.comboFx=true

# Small camera kicks on combo hits and criticals
ui.comboCamera=true

# Client-only mods whose network channel may be missing on the server (namespaces, comma separated): lets you join servers that don't have them
net.optionalChannels=particular

# Volume of every T'O EPK sound: menus, notices, combos, events (percent)
ui.masterVolume=100

# Volume of combo and critical hit sounds (percent)
ui.fxVolume=45

# Seconds a side notification stays on screen
notify.seconds=5

# Volume of the side notification sound (percent, 0 = silent)
notify.volume=50

# Side notifications shown at once (the rest wait their turn)
notify.max=4

# Text size of the side notifications (percent)
notify.textScale=105

# Notify completed missions
notify.quest=true

# Notify level ups
notify.level=true

# Notify weapon mastery level ups
notify.mastery=true

# Notify world event news (waves, victories, impacts)
notify.event=true

# Notify boss kills and your share of the loot
notify.boss=true

# Notify loot bags, crate keys and rewards
notify.loot=true

# Notify advancements (instead of the vanilla toast)
notify.achievement=true

# Notify crypt news
notify.crypt=true

# Notify merchant contracts (a new day's jobs, a job done)
notify.contract=true

# Show the vanilla 'new recipes unlocked' toasts
notify.recipes=false

# Ranked vanilla monsters (Élite, Campeón, Legendario): tougher, better loot, regalia and auras
mobs.ranks=true

# Chance of a vanilla monster to spawn as Élite
mobs.rankElite=0.06

# Chance of a vanilla monster to spawn as Campeón
mobs.rankChampion=0.015

# Chance of a vanilla monster to spawn as Legendario
mobs.rankLegend=0.003

# Multiplier of the coins a ranked monster drops (Élite ~0.3 gold, Campeón ~1.8, Legendario ~8)
mobs.rankCoins=1.0

# How much of the extra experience of ranked monsters applies (0 = none; 1 = Élite x1.3, Campeón x1.8, Legendario x2.5)
mobs.rankXp=1.0

# Ranked creepers look like More Creepers (spore, umber, electric, illusion, dazzle, nuclear) with their own animations
mobs.creeperModels=true

# Pillagers, vindicators, evokers, their fangs and ravagers drawn with Little Room's Better Pillagers models and animations
mobs.illagerModels=true

# Ranked spiders wear the spider packs' bodies (stalker, spitter, weaver, toxin, shadow, winged queen, colossus) with their animations
mobs.spiderModels=true

# Ranked spiders use their pack moves (dash, poison pools, web traps, toxic webs, shadow leaps and illusions, wing waves, stomps)
mobs.spiderSkills=true

# T'O EPK villagers (merchant, crypt cartographer, caravan) drawn with the Fantasy Arcane Vanguard NPC models (Ginko Studio)
mobs.villagerModels=true

# Those villagers say their voice lines with their gestures (hello when you come close, idle2 now and then)
mobs.villagerVoices=true

# Pets (Companions 2): one companion per player, from collars found in crates, crypts and bosses
pets.enabled=true

# Multiplier for the experience pets earn
pets.xpRate=1.0

# Multiplier for the chance of collars, skin boxes and treats
pets.dropRate=1.0

# Pets pick up dropped items and experience orbs near you and bring them to you
pets.collect=true

# Each pet family gives a small bonus to its owner while it is out (armour, luck, attack speed, damage, speed)
pets.passives=true

# Steamsparks gear: multiplier of the Overload damage (chain lightning, blasts, shockwave, steam jet)
steam.overloadDamage=1.0

# Mechs: adventurer level needed to craft mech parts and chassis
mech.partLevel=30

# Mechs: any class can build and pilot them (normally only the Engineer)
mech.anyClass=false

# Mechs: damage of each minigun bullet
mech.minigunDamage=3.0

# Mechs: damage of each rocket (4 per salvo)
mech.rocketDamage=9.0

# Mechs: damage of an artillery shell at the centre of its blast
mech.artilleryDamage=22.0

# Mechs: minigun heat per bullet (1 = overheated; it then cools down to 35% before firing again)
mech.minigunHeat=0.025

# Mechs: the miner's and the utility's drills break blocks (false: they only hurt)
mech.breakBlocks=true

# Mechs: miner drill speed multiplier (1 = a 3x4 face of stone in about 0.7 s, deepslate 1.4 s)
mech.minerDigSpeed=1.0

# Mechs: utility drill speed multiplier
mech.utilityDigSpeed=1.0

# Mechs: miner drill damage every 4 ticks
mech.minerDrillDamage=5.0

# Mechs: utility drill damage every 4 ticks
mech.utilityDrillDamage=6.0

# Mechs: miner pick smash damage
mech.minerPickDamage=16.0

# Mechs: miner charge damage
mech.minerChargeDamage=12.0

# Mechs: utility ground smash damage (also stuns 2.5 s)
mech.utilitySmashDamage=10.0

# Mechs: utility harpoon damage
mech.harpoonDamage=5.0

# Mechs: multiplier for all mech weapon damage
mech.damageMult=1.0

# Mechs: third-person camera distance while piloting (vanilla is 4)
mech.cameraDistance=10

# Mounts: clockwork dragonfly electric bolt damage
mech.dragonflyZapDamage=6.0

# Engineer: adventurer level needed for the Swarm ability (key G)
swarm.level=20

# Engineer: seconds between two Swarms
swarm.cooldown=90

# Mounts: third-person camera distance riding the dragonfly
mech.dragonflyCamera=7

# Armour from mods that only paint it on the vanilla model (Archie's Dinosaurs...) gets its real texture under Epic Fight instead of magenta/black
compat.armorTextures=true

# With sprint set to Toggle, the character really keeps running (some mods reset it every tick)
input.toggleSprintFix=true

# Campfire smoke ignores block collisions (big client saving where there are many campfires)
perf.cheapSmoke=true

# Animated GeckoLib blocks (Netherman traphives, pointed blackstone...) only drawn within this many blocks; 0 = vanilla (64)
perf.geoBlockDistance=32

# Ranked creepers blow up bigger (4/5/7) and with an effect of their kind (poison, lightning, blinding flash, radiation...)
mobs.creeperBlasts=true

# The Artifacts mimic looks like a MimicsPack chest (common, rare or legendary) with its own animations
mobs.mimicModel=true

# Coloured outline around a Legendario that is close and in sight
mobs.rankOutline=true

# Ranked vanilla mobs wear their own accessories (hats, crowns, capes...) that follow Epic Fight animations
mobs.rankAccessories=true

# Locked loot crates (common, rare, epic, legendary) appear in dungeons; they open with a key of their rarity found in the same dungeon
loot.crates=true

# Merchant contracts: three jobs a day (easy, medium, hard) collected from any merchant
loot.contracts=true

# Multiplier of the coins paid by merchant contracts
loot.contractCoins=1.0

# Multiplier of the coins inside loot crates (common ~0.1 gold, rare ~0.5, epic ~2, legendary ~7)
loot.crateCoins=1.0

# Minutes a crate key lasts before it fades away
loot.crateKeyMinutes=20

# Structure ids containing any of these words count as dungeons for loot crates
loot.crateStructures=dungeon,crypt,catacomb,tomb,labyrinth,maze,fortress,bastion,stronghold,citadel,castle,keep,tower,mansion,ancient_city,end_city,sanctum,lair,prison,vault,arena,temple_of,cursed,sunken,burning,frosted,factory,ruined_citadel,chamber,dungeons_and_combat,yungs,dungeoncrawl,integrated_stronghold

# Structure ids containing any of these words never get loot crates
loot.crateExclude=village,outpost,ruined_portal,shipwreck,igloo,swamp_hut,buried_treasure,ocean_ruin,trail_ruins,desert_pyramid,jungle_pyramid,mineshaft,pyramid_of_the,house,camp,well,farm,windmill

# Weapon mastery: each weapon family levels up (1-20) by fighting with it and unlocks milestones
mastery.enabled=true

# A weapon mastered to level 20 shines and breathes motes of its family colour (level 15: a few motes)
mastery.visible=true

# Multiplier of the mastery experience from kills
mastery.xpRate=1.0

# Damage bonus with a family per mastery level, in percent
mastery.damagePerLevel=0.5

# Price in copper to change a level 10/15 choice already made (100 = 1 gold)
mastery.changeCost=500

# Mastery ring next to the hotbar when the weapon gains experience
hud.masteryRing=true

# Chaining hits without getting hit builds a combo that gives bonus experience on the kill; a kill without taking damage is 'flawless'
combat.combo=true

# Player chat with the class badge, name in the class colour and a hover card (class and level)
chat.styled=true

# Modded weapons Epic Fight does not know (they hit like fists) get a matching Epic Fight weapon type (sword, greatsword, spear, dagger...) from their name or their Better Combat data
compat.epicFightAutoWeapons=true

# Items of other mods that clash with T'O EPK: taken out of inventories, unusable and without recipes (comma separated ids; Archie's melee weapons only draw with AstemirLib, never in Epic Fight)
compat.removedItems=dungeons_and_combat:combat_style_manual,ec_ad:theri_claw_copper,ec_ad:theri_claw_iron,ec_ad:theri_claw_gold,ec_ad:theri_claw_diamond,ec_ad:theri_claw_netherite,ec_ad:lush_mace,ec_ad:chorus_scythe

# Unfinished items hidden from the creative tabs (comma separated ids)
compat.hiddenItems=monsterexpansion:great_sword,monsterexpansion:test_sword,dungeons_and_combat:combat_style_manual,ec_ad:theri_claw_copper,ec_ad:theri_claw_iron,ec_ad:theri_claw_gold,ec_ad:theri_claw_diamond,ec_ad:theri_claw_netherite,ec_ad:lush_mace,ec_ad:chorus_scythe

# Rebuild custom armour models (outfits made with their own model) so they look right on the Epic Fight body
armor.epicFightBridge=true

# Custom armour models only show the parts of their own slot on the Epic Fight body (a chestplate no longer brings a head and legs)
armor.slotVisibility=true

# While riding with Epic Fight the head follows the look and the torso leans and sways with the mount
animation.mountPose=true

# Slots whose Geckolib armour T'O EPK rebuilds for Epic Fight (the rest use Epic Fight's own Geckolib support)
armor.geoBridgeSlots=HEAD,CHEST,LEGS,FEET

# Logs how every armour piece is prepared for Epic Fight (for diagnosing armours that look wrong)
armor.debug=false

# Armour pieces hanging off the chest that reach above and below the waist (wings, long back pieces) stay whole on the chest instead of tearing between chest and hips
armor.rigidAttachments=true

# AzureLib armours (Cataclysm: Spellbooks...) rebuilt so Epic Fight draws them with their own model and texture instead of purple
armor.azureBridge=true

# Custom armour models are placed like vanilla and pre-cut where Epic Fight bends the body (fixes floating pieces, spikes and missing sleeves)
armor.rebuildForEpicFight=true

# How often the portrait in the HUD is redrawn, in ms (0 = every frame, slower)
hud.portraitIntervalMs=70

# Logs how long each HUD element takes to draw, every 5 seconds (for finding FPS problems)
debug.hudProfiler=false

# Draws the glowing layer of Geckolib armours under Epic Fight (some pieces are made entirely of it)
armor.geoGlowLayer=true

# Geckolib armour mods whose models are rebuilt for Epic Fight (comma separated mod ids)
armor.geoBridgeMods=aquamirae,clockwork,traveloptics

# Move the menu buttons down so they do not overlap the logo
title.moveButtons=true

# Maximum logo width as a percentage of the screen width
title.maxWidthPercent=62

# Maximum logo height as a percentage of the screen height
title.maxHeightPercent=46

# Ajustes guardados desde el juego (posiciones y tamanos del HUD, etc.)
backpacks.crateLoot=true
backpacks.dropRate=1.0
backpacks.fit.depth=1.0
backpacks.fit.distance=-2.0
backpacks.fit.height=0.0
backpacks.fit.size=1.05
hud.banner.scale=1.00
hud.banner.x=0.00
hud.banner.y=-62.50
hud.compass.on=true
hud.event.scale=0.95
hud.event.x=1.70
hud.event.y=24.00
hud.look.on=false
hud.look.scale=1.00
hud.look.x=0.00
hud.look.y=6.00
hud.notify.scale=1.00
hud.notify.x=-2.00
hud.notify.y=-9.00
hud.panel.scale=1.10
hud.panel.x=2.60
hud.panel.y=-2.60
hud.tpa.scale=1.00
hud.tpa.x=-224.00
hud.tpa.y=-104.50
hud.tracker.scale=1.00
hud.tracker.x=2.00
hud.tracker.y=67.00
mech.autoRefuel=true
mech.heatPerShot=0.05
mech.minerDrillPower=0.55
mech.raptorBiteDamage=10.0
mech.raptorCamera=6
mech.raptorRamDamage=12.0
mech.utilityDrillPower=0.35
