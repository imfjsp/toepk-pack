# T'O EPK settings

# Replace the Minecraft logo on the title screen with the T'O EPK logo
title.customLogo=true

# Animate the dragon head (slow, subtle movement)
title.animateHead=true

# Pulsing glow on the dragon eye
title.eyeGlow=true

# Twinkling sparkles on the logo
title.sparkles=true

# Hide the yellow splash text
title.hideSplash=true

# Logo rises and fades in each time you return to the main menu
title.introAnimation=true

# Use the T'O EPK animated background instead of the vanilla panorama
title.customBackground=true

# Background layers move slightly with the mouse
title.parallax=true

# Floating light particles on the background
title.particles=true

# Hide the version/branding lines, update notice and copyright text
title.removeExtraTexts=true

# Left-side menu with only Singleplayer, Multiplayer, Mods and Quit
title.customMenu=true

# Animated lights (glow, flicker, fog) on the menu background
title.lightEffects=true

# Built-in resource pack that recolours other mods' screens (Epic Fight's skill editor) in T'O EPK purple
ui.themeOtherScreens=true

# Xaero's World Map without its side buttons (right click on the map creates and shares waypoints)
ui.cleanWorldMap=true

# Epic Fight's skill key opens the T'O EPK skill screen on the combat techniques tab
ui.efSkillsTab=true

# T'O EPK item tooltips: sections, icons, Shift for descriptions, tier-coloured border
ui.customTooltips=true

# Minimal T'O EPK style for buttons and sliders in every screen
ui.minimalWidgets=true

# Show the T'O EPK background behind menus outside a world (options, create world, mods...)
ui.backgroundInMenus=true

# How dark the background is behind other menus (0-100)
ui.menuDimPercent=62

# T'O EPK loading screen instead of the Mojang logo and white bar
ui.loadingScreen=true

# Smooth transitions when creating/entering a world and returning to the main menu
ui.transitions=true

# Remove the small icon buttons other mods add to the pause menu
ui.cleanPauseMenu=true

# Give the class starter kit the first time a player chooses a class
classes.starterKit=true

# Let players change their class freely (admins can always use /toepk clase asignar)
classes.allowChange=false

# Experience multiplier in percent (100 = normal)
levels.xpPercent=100

# Weapons above your tier deal less damage and armour above your tier cannot be equipped
tiers.enforce=true

# Show the level panel (top right). Toggle in game with the HUD key
hud.panel=true

# Show the compass bar at the top of the screen
hud.compass=true

# Show coordinates under the compass
hud.coords=true

# Show info about the block or creature you are looking at
hud.lookInfo=true

# Minimum GUI scale used by the T'O EPK menus (bigger text); 0 = use the game GUI scale
ui.menuScale=3

# Hostile mobs spawn with a level based on nearby players
mobs.scaling=true

# Radius to look for players when a mob spawns
mobs.radius=96

# Random variation of the mob level (+/-)
mobs.spread=2

# Extra health per mob level (0.04 = +4% per level)
mobs.healthPerLevel=0.04

# Extra damage per mob level
mobs.damagePerLevel=0.025

# Extra armor per mob level
mobs.armorPerLevel=0.08

# Scaling multiplier for bosses
mobs.bossFactor=0.5

# Entities that never scale (comma separated)
mobs.exclude=minecraft:ender_dragon

# Show the level plate over mobs
mobs.tags=true

# Max distance to show mob levels (double when you aim at them)
mobs.tagDistance=20

# Level needed to use the rebirth orb (you get one when you reach it)
rebirth.level=50

# Experience multiplier gained per rebirth (stacks: 2 rebirths = x4, 3 = x8...)
rebirth.xpMultiplier=2.0

# Creatures that are never treated as bosses (comma separated ids)
mobs.notBosses=

# Extra creatures always treated as bosses (comma separated ids)
mobs.bosses=

# World events: blood moon, raider siege, meteor shower, merchant caravan and wandering boss
events.enabled=true

# First in-game day an event can happen
events.firstDay=20

# Minimum in-game days between two events
events.minDays=6

# Maximum in-game days between two events
events.maxDays=14

# Monster level multiplier during the blood moon
events.bloodMoonLevelMultiplier=2.0

# Minimum distance (blocks) from a player where the big meteor falls
events.meteorMinDistance=200

# Maximum distance (blocks) from a player where the big meteor falls
events.meteorMaxDistance=300

# Translate automatically every mod text that has no translation in the game's language (cached in config/toepk/traducciones; edit those files to fix a translation)
translate.enabled=true

# Optional free key from Google AI Studio (aistudio.google.com/apikey): translates with Gemini, much faster and better than the free Google Translate
translate.geminiKey=

# Gemini model used for translating
translate.geminiModel=gemini-2.5-flash-lite

# Highest level a monster or boss can have
mobs.maxLevel=100

# The Epic Fight bosses that end each crypt (Arachne, Leonidas, Mimic, Wraithon) can only be fought through a crypt: their items, arenas and spawns are locked
crypt.lockBosses=true

# Final boss of the copper crypt (entity id, or a bare name searched among all mods). Also: .dimension, .x, .y, .z (arrival), .bossDx, .bossDz, .radius, .lockedItems
crypt.boss.copper.entity=arachne

# Final boss of the jade crypt
crypt.boss.jade.entity=leonidas

# Final boss of the abyssal crypt
crypt.boss.abyss.entity=mimic

# Final boss of the obsidian crypt
crypt.boss.obsidian.entity=wraithon

# Meteor guardians per kind (the first that exists is used): kind:entity=health multiplier
events.meteorGuardians=fire:cataclysm:ignited_revenant=3,fire:cataclysm:ignited_berserker=5,radioactive:alexscaves:brainiac=4,crystal:cataclysm:amethyst_crab=2,void:cataclysm:ender_golem=2,void:minecraft:enderman=8

# A surface structure is not generated where it would overlap or touch another one (villages and strongholds always keep their place)
worldgen.noStructureOverlap=true

# Minimum gap in blocks between two surface structures
worldgen.structureMargin=6

# Every Iron's Spellbooks spell is already learned (eldritch spells too) and spell scrolls are never locked by level
compat.ironsLearnAll=true

# Extra damage (%) when a class fights with the weapons of its speciality (swords for the warrior, katanas for the ronin, bows for the archer...)
classes.specialtyPercent=12

# Red reticle on mobs: a hit aimed inside it is a critical (it moves every few seconds)
combat.weakPoints=true

# Damage multiplier of a critical hit (inside the red reticle)
combat.critMultiplier=1.6

# Ticks allowed between two hits to keep the combo going (20 = 1 second)
combat.comboWindowTicks=50

# Combo counter next to the mob, with sounds and effects
ui.comboFx=true

# Small camera kicks on combo hits and criticals
ui.comboCamera=true

# Volume of combo and critical hit sounds (percent)
ui.fxVolume=45

# Seconds a side notification stays on screen
notify.seconds=5

# Volume of the side notification sound (percent, 0 = silent)
notify.volume=50

# Side notifications shown at once (the rest wait their turn)
notify.max=4

# Text size of the side notifications (percent)
notify.textScale=100

# Notify completed missions
notify.quest=true

# Notify level ups
notify.level=true

# Notify weapon mastery level ups
notify.mastery=true

# Notify world event news (waves, victories, impacts)
notify.event=true

# Notify boss kills and your share of the loot
notify.boss=true

# Notify loot bags, crate keys and rewards
notify.loot=true

# Notify advancements (instead of the vanilla toast)
notify.achievement=true

# Notify crypt news
notify.crypt=true

# Show the vanilla 'new recipes unlocked' toasts
notify.recipes=false

# Ranked vanilla monsters (Élite, Campeón, Legendario): tougher, better loot, regalia and auras
mobs.ranks=true

# Chance of a vanilla monster to spawn as Élite
mobs.rankElite=0.06

# Chance of a vanilla monster to spawn as Campeón
mobs.rankChampion=0.015

# Chance of a vanilla monster to spawn as Legendario
mobs.rankLegend=0.003

# Coloured outline around a Legendario that is close and in sight
mobs.rankOutline=true

# Ranked vanilla mobs wear their own accessories (hats, crowns, capes...) that follow Epic Fight animations
mobs.rankAccessories=true

# Locked loot crates (common, rare, epic, legendary) appear in dungeons; they open with a key of their rarity found in the same dungeon
loot.crates=true

# Minutes a crate key lasts before it fades away
loot.crateKeyMinutes=20

# Structure ids containing any of these words count as dungeons for loot crates
loot.crateStructures=dungeon,crypt,catacomb,tomb,labyrinth,maze,fortress,bastion,stronghold,citadel,castle,keep,tower,mansion,ancient_city,end_city,sanctum,lair,prison,vault,arena,temple_of,cursed,sunken,burning,frosted,factory,ruined_citadel,chamber,dungeons_and_combat,yungs,dungeoncrawl,integrated_stronghold

# Structure ids containing any of these words never get loot crates
loot.crateExclude=village,outpost,ruined_portal,shipwreck,igloo,swamp_hut,buried_treasure,ocean_ruin,trail_ruins,desert_pyramid,jungle_pyramid,mineshaft,pyramid_of_the,house,camp,well,farm,windmill

# Weapon mastery: each weapon family levels up (1-20) by fighting with it and unlocks milestones
mastery.enabled=true

# Multiplier of the mastery experience from kills
mastery.xpRate=1.0

# Damage bonus with a family per mastery level, in percent
mastery.damagePerLevel=0.5

# Price in copper to change a level 10/15 choice already made (100 = 1 gold)
mastery.changeCost=500

# Mastery ring next to the hotbar when the weapon gains experience
hud.masteryRing=true

# Chaining hits without getting hit builds a combo that gives bonus experience on the kill; a kill without taking damage is 'flawless'
combat.combo=true

# Player chat with the class badge, name in the class colour and a hover card (class and level)
chat.styled=true

# Modded weapons Epic Fight does not know (they hit like fists) get a matching Epic Fight weapon type (sword, greatsword, spear, dagger...) from their name or their Better Combat data
compat.epicFightAutoWeapons=true

# Items of other mods that clash with T'O EPK: taken out of inventories and unusable (comma separated ids)
compat.removedItems=dungeons_and_combat:combat_style_manual

# Unfinished items hidden from the creative tabs (comma separated ids)
compat.hiddenItems=monsterexpansion:great_sword,monsterexpansion:test_sword,dungeons_and_combat:combat_style_manual

# Rebuild custom armour models (outfits made with their own model) so they look right on the Epic Fight body
armor.epicFightBridge=true

# Custom armour models only show the parts of their own slot on the Epic Fight body (a chestplate no longer brings a head and legs)
armor.slotVisibility=true

# While riding with Epic Fight the head follows the look and the torso leans and sways with the mount
animation.mountPose=true

# Slots whose Geckolib armour T'O EPK rebuilds for Epic Fight (the rest use Epic Fight's own Geckolib support)
armor.geoBridgeSlots=HEAD,CHEST,LEGS,FEET

# Logs how every armour piece is prepared for Epic Fight (for diagnosing armours that look wrong)
armor.debug=false

# Custom armour models are placed like vanilla and pre-cut where Epic Fight bends the body (fixes floating pieces, spikes and missing sleeves)
armor.rebuildForEpicFight=true

# How often the portrait in the HUD is redrawn, in ms (0 = every frame, slower)
hud.portraitIntervalMs=200

# Logs how long each HUD element takes to draw, every 5 seconds (for finding FPS problems)
debug.hudProfiler=false

# Draws the glowing layer of Geckolib armours under Epic Fight (some pieces are made entirely of it)
armor.geoGlowLayer=true

# Geckolib armour mods whose models are rebuilt for Epic Fight (comma separated mod ids)
armor.geoBridgeMods=aquamirae,clockwork

# Move the menu buttons down so they do not overlap the logo
title.moveButtons=true

# Maximum logo width as a percentage of the screen width
title.maxWidthPercent=62

# Maximum logo height as a percentage of the screen height
title.maxHeightPercent=46

# Ajustes guardados desde el juego (posiciones y tamanos del HUD, etc.)
hud.look.on=false
hud.look.scale=1.00
hud.look.x=0.00
hud.look.y=20.00
title.creatureEyes=false
