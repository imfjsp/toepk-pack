# TOEPK Tweaks - pon false para desactivar un parche. Requiere reiniciar el juego.
# dab.* = IA mas liviana para mobs lejanos.
#   startDistance: a menos de estos bloques de un jugador los mobs piensan normal.
#   maxFrequency: como maximo, cada cuantos ticks piensa un mob lejano.
#   distanceDivisorBits: 8 = cada tick a 24 bloques, cada 4 a 32, cada 9 a 48, cada 10 desde ~51.
dab.enabled=true
dab.startDistance=24
dab.maxFrequency=10
dab.distanceDivisorBits=8
patch.quark_trough=true
patch.wither_avoid=true
patch.jerotes_anesthetized=true
patch.farm_charm_sync=true
patch.simplyswords_incap=true
patch.waves_phase=true
patch.knightlib_pick=true
patch.ydtwo_visuals=true
# Evita el crash "causalAnimation is null" de EpicFight Resurrection con Epic Fight 20.14+
fix.epicfight_null_combo=true
# Mantiene el modelo de Epic Fight cuando usas habilidades de Mowzie (hacha de hierro forjado, etc.)
fix.mowzie_epicfight_model=true
# Animacion de Epic Fight (solo visual) para el clic derecho del Hacha de Hierro Forjado de Mowzie
# Otras opciones: epicfight:biped/combat/greatsword_auto2, epicfight:biped/combat/axe_auto1, epicfight_dd:biped/combat/steelaxe_auto2, epicfightx:biped/combat/axe_auto3
mowzie.axe_swing_animation=epicfight_dd:biped/combat/steelaxe_auto1
# Golpe hacia abajo del hacha. Otras opciones: epicfightx:biped/skill/greatsword_slam, epicfight:biped/combat/greatsword_auto1
mowzie.axe_slam_animation=epicfight_dd:biped/skill/groundslam
# Evita el crash de Weapons of Miracles (Satsujin, Ruine, Ender Fusion) cuando no tienes equipada la pasiva del arma
fix.wom_null_skill=true
